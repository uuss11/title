<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مطعم النخبة | Elite Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #ea580c; --bg-main: #f8fafc; --text-color: #1e293b; --card-bg: #ffffff; }
        body { font-family: 'Tajawal', sans-serif; background: var(--bg-main); color: var(--text-color); transition: all 0.4s ease; overflow-x: hidden; }

        /* الثيمات */
        .theme-coffee { --bg-main: #2d1b14; --text-color: #efebe9; --card-bg: #3e2723; --primary: #d7ccc8; background: linear-gradient(45deg, #2d1b14, #4e342e, #2d1b14); background-size: 400% 400%; animation: moveGrad 12s infinite; }
        .theme-dark { --bg-main: #0f172a; --text-color: #f1f5f9; --card-bg: #1e293b; --primary: #38bdf8; }
        .theme-indigo { --bg-main: #eef2ff; --text-color: #1e1b4b; --card-bg: #ffffff; --primary: #4338ca; }
        @keyframes moveGrad { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

        .sidebar { position: fixed; top: 0; right: 0; height: 100%; width: 300px; background: var(--card-bg); z-index: 2000; transform: translateX(100%); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: -10px 0 30px rgba(0,0,0,0.1); padding: 2rem; }
        .sidebar.active { transform: translateX(0); }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1500; display: none; backdrop-filter: blur(4px); }
        .overlay.active { display: block; }

        .glass-nav { position: sticky; top: 0; z-index: 1000; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0,0,0,0.05); }
        .theme-dark .glass-nav, .theme-coffee .glass-nav { background: rgba(0,0,0,0.3); border-bottom: 1px solid rgba(255,255,255,0.1); }
        
        .food-card { background: var(--card-bg); border-radius: 2rem; overflow: hidden; border: 1px solid rgba(0,0,0,0.05); transition: 0.3s; }
        .btn-primary { background: var(--primary); color: white; border-radius: 1rem; font-weight: bold; transition: 0.3s; }
        .btn-primary:active { scale: 0.95; }
        
        .star { font-size: 1.5rem; cursor: pointer; color: #ddd; transition: 0.2s; }
        .star.filled { color: #fbbf24; }
    </style>
</head>
<body class="min-h-screen pb-24">

<div id="overlay" class="overlay" onclick="toggleSidebar()"></div>
<aside id="sidebar" class="sidebar">
    <div class="flex justify-between items-center mb-10">
        <h2 class="text-xl font-black">القائمة الجانبية</h2>
        <button onclick="toggleSidebar()" class="text-3xl">&times;</button>
    </div>

    <div class="space-y-6">
        <div>
            <p class="text-xs font-bold opacity-50 mb-4 tracking-tighter uppercase">اختر طابعك الخاص</p>
            <div id="themesList" class="grid grid-cols-1 gap-3">
                <button onclick="applyTheme('default')" class="flex items-center gap-3 p-3 rounded-2xl border hover:bg-gray-50 dark:hover:bg-white/5 transition-all">
                    <div class="w-8 h-8 rounded-lg bg-white border shadow-sm"></div> <span class="font-bold text-sm">الأبيض الناصع</span>
                </button>
                <button onclick="applyTheme('coffee')" class="flex items-center gap-3 p-3 rounded-2xl border hover:bg-gray-50 dark:hover:bg-white/5 transition-all">
                    <div class="w-8 h-8 rounded-lg bg-[#3e2723]"></div> <span class="font-bold text-sm">قهوة متدرج</span>
                </button>
                <button onclick="applyTheme('dark')" class="flex items-center gap-3 p-3 rounded-2xl border hover:bg-gray-50 dark:hover:bg-white/5 transition-all">
                    <div class="w-8 h-8 rounded-lg bg-[#0f172a]"></div> <span class="font-bold text-sm">أسود ورصاصي</span>
                </button>
                <button onclick="applyTheme('indigo')" class="flex items-center gap-3 p-3 rounded-2xl border hover:bg-gray-50 dark:hover:bg-white/5 transition-all">
                    <div class="w-8 h-8 rounded-lg bg-[#4338ca]"></div> <span class="font-bold text-sm">نيلي هادئ</span>
                </button>
            </div>
        </div>

        <div id="adminControls" class="hidden border-t pt-6 space-y-3">
            <p class="text-xs font-bold text-orange-600 uppercase mb-4">أدوات الإدارة</p>
            <button onclick="showOrders()" class="w-full bg-blue-600 text-white p-4 rounded-2xl font-bold shadow-lg shadow-blue-200">📋 قائمة الطلبات</button>
            <button onclick="addForm()" class="w-full bg-black text-white p-4 rounded-2xl font-bold shadow-lg">➕ إضافة صنف جديد</button>
            
            <div class="mt-8 border-t pt-4">
                <p class="text-[10px] opacity-60 mb-2">إنشاء ثيم مخصص (تجريبي)</p>
                <div class="flex gap-2">
                    <input type="color" id="c1" class="flex-1 h-10 rounded-lg">
                    <input type="color" id="c2" class="flex-1 h-10 rounded-lg">
                    <button onclick="customTheme()" class="bg-gray-200 px-3 rounded-lg font-bold">🛠</button>
                </div>
            </div>
        </div>
    </div>
</aside>

<nav class="glass-nav p-4">
    <div class="max-w-5xl mx-auto flex justify-between items-center">
        <button onclick="toggleSidebar()" class="w-12 h-12 flex flex-col justify-center gap-1.5 items-center bg-gray-50 dark:bg-white/10 rounded-2xl active:scale-90 transition-all">
            <span class="w-6 h-0.5 bg-current"></span>
            <span class="w-6 h-0.5 bg-current"></span>
            <span class="w-6 h-0.5 bg-current"></span>
        </button>
        <h1 class="text-xl font-black italic tracking-tighter">ELITE <span class="text-orange-600">RESTAURANT</span></h1>
        <button onclick="adminLogin()" id="adminBtn" class="bg-black text-white text-[10px] px-4 py-2 rounded-xl font-black active:scale-95 transition-all">ADMIN LOGIN</button>
    </div>
</nav>

<div class="max-w-5xl mx-auto p-4 mt-4">
    <div class="flex gap-3 mb-8">
        <input id="searchBox" oninput="renderApp()" type="text" placeholder="ماذا تشتهي اليوم؟" class="flex-1 p-4 rounded-2xl bg-white dark:bg-white/5 shadow-sm outline-none ring-2 ring-transparent focus:ring-orange-500 transition-all">
        <select id="catFilter" onchange="renderApp()" class="p-4 rounded-2xl bg-white dark:bg-white/5 shadow-sm outline-none font-bold text-sm">
            <option value="all">كل المنيو</option>
            <option value="أكل">أطباق رئيسية</option>
            <option value="مشروب">مشروبات</option>
            <option value="حلويات">حلويات</option>
        </select>
    </div>

    <main id="appGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></main>
</div>

<div id="cartBar" class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-lg bg-white dark:bg-slate-800 shadow-2xl rounded-[2rem] p-4 hidden z-[1100] border border-orange-100 flex justify-between items-center">
    <div class="flex items-center gap-4">
        <div class="w-12 h-12 bg-orange-100 text-orange-600 rounded-2xl flex items-center justify-center font-black">🛒</div>
        <div>
            <p class="text-[10px] opacity-50 font-bold uppercase">إجمالي الحساب</p>
            <p id="cartTotal" class="text-lg font-black text-orange-600">0 IQD</p>
        </div>
    </div>
    <button onclick="openCheckout()" class="bg-orange-600 text-white px-10 py-4 rounded-2xl font-black shadow-lg shadow-orange-200 active:scale-95 transition-all">تأكيد الطلب</button>
</div>

<div id="modal" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center p-4 z-[3000] backdrop-blur-md">
    <div class="bg-white dark:bg-slate-900 rounded-[3rem] p-8 w-full max-w-md relative max-h-[90vh] overflow-y-auto">
        <button onclick="closeModal()" class="absolute top-6 left-6 text-gray-400 text-3xl hover:text-black">&times;</button>
        <div id="modalBody" class="mt-2"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, push, onValue, update, remove, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAUx02wlCwG41MBEob1Ql6vKwEaotaaY6g",
        authDomain: "matam-3dad8.firebaseapp.com",
        databaseURL: "https://matam-3dad8-default-rtdb.firebaseio.com",
        projectId: "matam-3dad8",
        storageBucket: "matam-3dad8.firebasestorage.app",
        messagingSenderId: "275561023621",
        appId: "1:275561023621:web:123ae0e8173b15895981ec"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let menu = [], cart = [], isAdmin = false;

    // تهيئة الثيم
    const currentTheme = localStorage.getItem('elite-theme') || 'default';
    if(currentTheme !== 'default') document.body.classList.add('theme-' + currentTheme);

    window.toggleSidebar = () => {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('overlay').classList.toggle('active');
    };

    window.applyTheme = (t) => {
        document.body.className = "min-h-screen pb-24";
        if(t !== 'default') document.body.classList.add('theme-' + t);
        localStorage.setItem('elite-theme', t);
        toggleSidebar();
    };

    // مزامنة البيانات
    onValue(ref(db, 'menu'), (snap) => {
        const data = snap.val();
        menu = data ? Object.entries(data).map(([k, v]) => ({...v, fKey: k})) : [];
        renderApp();
    });

    window.renderApp = () => {
        const grid = document.getElementById('appGrid');
        const search = document.getElementById('searchBox').value.toLowerCase();
        const cat = document.getElementById('catFilter').value;
        grid.innerHTML = '';

        menu.forEach(item => {
            if (cat !== 'all' && item.category !== cat) return;
            if (search && !item.name.toLowerCase().includes(search)) return;

            let finalPrice = item.price;
            let hasDiscount = item.discount > 0 && (!item.expiry || Date.now() < item.expiry);
            if(hasDiscount) finalPrice = item.price - (item.price * item.discount / 100);

            grid.innerHTML += `
                <div class="food-card shadow-sm hover:shadow-2xl transition-all group relative">
                    ${hasDiscount ? `<span class="absolute top-4 right-4 bg-red-600 text-white text-[10px] px-3 py-1 rounded-full z-10 font-black">-${item.discount}%</span>` : ''}
                    <div class="overflow-hidden h-40">
                        <img src="${item.imageUrl}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500 cursor-pointer" onclick="viewItem('${item.fKey}')">
                    </div>
                    <div class="p-4">
                        <h3 class="font-bold text-sm mb-1 truncate">${item.name}</h3>
                        <div class="flex items-center gap-2 mb-4">
                            <span class="text-orange-600 font-black text-xs">${finalPrice.toLocaleString()} IQD</span>
                            ${hasDiscount ? `<span class="text-gray-400 text-[10px] line-through">${item.price.toLocaleString()}</span>` : ''}
                        </div>
                        <button onclick="addToCart('${item.fKey}')" class="w-full bg-slate-100 hover:bg-orange-600 hover:text-white py-3 rounded-2xl text-[10px] font-black transition-all">إضافة للسلة</button>
                        ${isAdmin ? `<button onclick="adminTools('${item.fKey}')" class="w-full mt-2 bg-black text-white py-2 rounded-xl text-[10px] font-bold">⚙️ إدارة الصنف</button>` : ''}
                    </div>
                </div>
            `;
        });
    };

    window.addToCart = (key) => {
        const item = menu.find(i => i.fKey === key);
        cart.push(item);
        updateCartUI();
    };

    function updateCartUI() {
        const bar = document.getElementById('cartBar');
        if(cart.length > 0) {
            bar.classList.remove('hidden');
            let total = cart.reduce((s, i) => {
                let p = i.price;
                if(i.discount > 0 && (!i.expiry || Date.now() < i.expiry)) p -= (p * i.discount / 100);
                return s + p;
            }, 0);
            document.getElementById('cartTotal').innerText = total.toLocaleString() + " IQD";
        } else {
            bar.classList.add('hidden');
        }
    }

    window.openCheckout = () => {
        let itemsHtml = cart.map((item, idx) => `
            <div class="flex justify-between items-center mb-3 bg-gray-50 dark:bg-white/5 p-4 rounded-2xl">
                <span class="text-xs font-bold">${item.name}</span>
                <button onclick="removeFromCart(${idx})" class="text-red-500 text-xl font-bold">&times;</button>
            </div>
        `).join('');
        
        showModal(`
            <h2 class="text-2xl font-black mb-6">مراجعة طلبك</h2>
            <div class="mb-6 max-h-48 overflow-y-auto">${itemsHtml}</div>
            <div class="bg-orange-50 dark:bg-orange-950/30 p-4 rounded-3xl mb-6">
                <p class="text-[10px] font-bold text-orange-600 mb-2 uppercase">موقعك</p>
                <select id="tNum" class="w-full bg-transparent outline-none font-black text-lg">
                    ${Array.from({length:30}, (_,i) => `<option value="${i+1}">طاولة رقم ${i+1}</option>`).join('')}
                </select>
            </div>
            <button onclick="sendOrder()" class="w-full bg-orange-600 text-white p-5 rounded-[2rem] font-black shadow-xl">إرسال للمطبخ</button>
        `);
    };

    window.removeFromCart = (idx) => { cart.splice(idx, 1); openCheckout(); updateCartUI(); };

    window.sendOrder = () => {
        const order = {
            table: document.getElementById('tNum').value,
            items: cart.map(i => i.name).join(' + '),
            status: '⏳ قيد الانتظار',
            time: new Date().toLocaleTimeString('ar-EG'),
            total: document.getElementById('cartTotal').innerText
        };
        push(ref(db, 'orders'), order).then(() => {
            alert("تم إرسال طلبك بنجاح!");
            cart = []; updateCartUI(); closeModal();
        });
    };

    window.adminLogin = async () => {
        const pass = prompt("كلمة مرور الإدارة:");
        if(!pass) return;
        const sRef = ref(db, 'settings/adminPass');
        const snap = await get(sRef);
        if(!snap.exists() || snap.val() === pass) {
            if(!snap.exists()) await set(sRef, pass);
            isAdmin = true;
            document.getElementById('adminBtn').innerText = "وضع المدير مفعل";
            document.getElementById('adminControls').classList.remove('hidden');
            renderApp();
        } else {
            alert("كلمة المرور خاطئة!");
        }
    };

    window.addForm = () => {
        toggleSidebar();
        showModal(`
            <h2 class="text-xl font-black mb-6">إضافة وجبة جديدة</h2>
            <div class="space-y-4">
                <input id="n" placeholder="اسم الوجبة" class="w-full p-4 bg-gray-100 rounded-2xl outline-none">
                <select id="c" class="w-full p-4 bg-gray-100 rounded-2xl outline-none">
                    <option>أكل</option><option>مشروب</option><option>حلويات</option>
                </select>
                <input id="p" type="number" placeholder="السعر" class="w-full p-4 bg-gray-100 rounded-2xl outline-none">
                <div>
                    <input id="u" placeholder="رابط الصورة المباشر" class="w-full p-4 bg-gray-100 rounded-2xl outline-none mb-1">
                    <p class="text-[10px] text-red-500 font-bold">لاستخراج رابط الصورة <a href="https://catbox.moe/#" target="_blank" class="text-green-600">انقر هنا</a></p>
                </div>
                <button onclick="saveItem()" class="w-full bg-black text-white p-5 rounded-2xl font-black">نشر الصنف</button>
            </div>
        `);
    };

    window.saveItem = () => {
        const item = {
            name: document.getElementById('n').value,
            category: document.getElementById('c').value,
            price: Number(document.getElementById('p').value),
            imageUrl: document.getElementById('u').value,
            discount: 0, ratingSum: 0, ratingCount: 0
        };
        push(ref(db, 'menu'), item).then(closeModal);
    };

    window.adminTools = (key) => {
        showModal(`
            <div class="grid grid-cols-1 gap-3">
                <button onclick="discountUI('${key}')" class="p-5 bg-orange-50 text-orange-600 rounded-3xl font-black">تفعيل خصم %</button>
                <button onclick="removeDiscount('${key}')" class="p-5 border rounded-3xl font-bold">إزالة الخصم</button>
                <button onclick="deleteItem('${key}')" class="p-5 bg-red-50 text-red-600 rounded-3xl font-black">حذف الصنف نهائياً</button>
            </div>
        `);
    };

    window.removeDiscount = (key) => update(ref(db, `menu/${key}`), {discount: 0, expiry: 0}).then(closeModal);
    window.deleteItem = (key) => { if(confirm('هل تريد حذف هذه الوجبة؟')) remove(ref(db, `menu/${key}`)).then(closeModal); };

    window.discountUI = (key) => {
        showModal(`
            <h2 class="font-black mb-4">ضبط نسبة الخصم</h2>
            <input id="perc" type="number" placeholder="مثال: 20" class="w-full p-4 bg-gray-100 rounded-2xl mb-4 outline-none">
            <button onclick="applyDiscount('${key}')" class="w-full bg-red-600 text-white p-4 rounded-2xl font-black">تأكيد الخصم</button>
        `);
    };
    window.applyDiscount = (key) => {
        const p = document.getElementById('perc').value;
        update(ref(db, `menu/${key}`), {discount: Number(p)}).then(closeModal);
    };

    window.showOrders = () => {
        toggleSidebar();
        get(ref(db, 'orders')).then(snap => {
            const data = snap.val();
            let html = data ? Object.entries(data).reverse().map(([k, v]) => `
                <div class="p-5 border-b mb-4 bg-gray-50 dark:bg-white/5 rounded-3xl">
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <p class="font-black text-lg">طاولة ${v.table}</p>
                            <p class="text-[10px] opacity-50">${v.time}</p>
                        </div>
                        <span class="bg-orange-100 text-orange-600 px-3 py-1 rounded-full text-[10px] font-black">${v.status}</span>
                    </div>
                    <p class="text-sm font-bold mb-4">${v.items}</p>
                    <div class="flex gap-2">
                        <button onclick="updateOrder('${k}', '✅ مكتمل')" class="flex-1 bg-green-600 text-white py-2 rounded-xl text-[10px] font-bold">اكتمل</button>
                        <button onclick="updateOrder('${k}', '❌ مرفوض')" class="flex-1 bg-red-500 text-white py-2 rounded-xl text-[10px] font-bold">أرفض</button>
                        <button onclick="deleteOrder('${k}')" class="flex-1 bg-gray-200 text-black py-2 rounded-xl text-[10px] font-bold">حذف</button>
                    </div>
                </div>
            `).join('') : '<p class="text-center opacity-40">لا توجد طلبات حالياً</p>';
            showModal(`<h2 class="text-xl font-black mb-6">سجل الطلبات</h2><div class="max-h-[60vh] overflow-y-auto">${html}</div>`);
        });
    };

    window.updateOrder = (k, s) => update(ref(db, `orders/${k}`), {status: s}).then(showOrders);
    window.deleteOrder = (k) => { if(confirm('حذف السجل؟')) remove(ref(db, `orders/${k}`)).then(showOrders); };

    window.viewItem = (key) => {
        const item = menu.find(i => i.fKey === key);
        const rating = (item.ratingSum / (item.ratingCount || 1)).toFixed(1);
        showModal(`
            <img src="${item.imageUrl}" class="w-full h-64 object-cover rounded-[2.5rem] mb-6 shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-black">${item.name}</h2>
                <div class="bg-orange-100 text-orange-600 px-4 py-1 rounded-full font-black">⭐ ${rating}</div>
            </div>
            <p class="text-center text-gray-400 text-sm mb-4">ما رأيك في هذه الوجبة؟</p>
            <div class="flex justify-center gap-3 mb-6">
                ${[1,2,3,4,5].map(n => `<span onclick="rateItem('${key}', ${n})" class="star ${n <= Math.round(rating) ? 'filled' : ''}">★</span>`).join('')}
            </div>
            <p class="text-center text-[10px] opacity-40">عدد المقيمين: ${item.ratingCount || 0}</p>
        `);
    };

    window.rateItem = (key, n) => {
        const item = menu.find(i => i.fKey === key);
        update(ref(db, `menu/${key}`), {
            ratingSum: (item.ratingSum || 0) + n,
            ratingCount: (item.ratingCount || 0) + 1
        }).then(() => { alert("شكراً لتقييمك!"); closeModal(); });
    };

    window.showModal = (content) => { document.getElementById('modalBody').innerHTML = content; document.getElementById('modal').classList.remove('hidden'); };
    window.closeModal = () => document.getElementById('modal').classList.add('hidden');
    
    window.customTheme = () => {
        const c1 = document.getElementById('c1').value;
        const c2 = document.getElementById('c2').value;
        document.body.style.background = `linear-gradient(45deg, ${c1}, ${c2})`;
        document.body.style.color = "#fff";
        alert("تم تطبيق الألوان!");
    };
</script>
</body>
</html>
