<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منيو المطعم الاحترافي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .badge-discount { background: linear-gradient(45deg, #ff416c, #ff4b2b); }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #ff6b00; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-28">

<nav class="glass sticky top-0 z-50 shadow-sm p-4">
    <div class="max-w-5xl mx-auto flex flex-col gap-4">
        <div class="flex justify-between items-center">
            <h1 class="text-2xl font-black text-orange-600">🔥 مـطعمنا الذكي</h1>
            <button onclick="adminLogin()" id="adminBtn" class="bg-gray-800 text-white text-xs px-4 py-2 rounded-full font-bold">دخول الإدارة</button>
        </div>
        <div class="flex gap-2">
            <input id="searchBox" oninput="renderApp()" type="text" placeholder="ابحث عن وجبة..." class="flex-1 p-3 rounded-2xl border-none ring-1 ring-gray-200 focus:ring-2 focus:ring-orange-500 outline-none text-sm">
            <select id="catFilter" onchange="renderApp()" class="p-3 rounded-2xl border-none ring-1 ring-gray-200 text-sm outline-none">
                <option value="all">الكل</option>
                <option value="أكل">أطباق رئيسية</option>
                <option value="مشروب">مشروبات</option>
                <option value="حلويات">حلويات</option>
            </select>
        </div>
    </div>
</nav>

<main id="appGrid" class="max-w-5xl mx-auto p-4 grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></main>

<div id="cartBar" class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-lg glass border shadow-2xl rounded-3xl p-4 hidden z-50 flex justify-between items-center">
    <div>
        <span class="text-xs text-gray-500 block">إجمالي الطلب</span>
        <span id="cartTotal" class="font-black text-orange-600">0 IQD</span>
    </div>
    <button onclick="openCheckout()" class="bg-orange-600 text-white px-8 py-3 rounded-2xl font-bold shadow-lg shadow-orange-200">اطلب الآن</button>
</div>

<div id="modal" class="fixed inset-0 bg-black/70 hidden flex items-center justify-center p-4 z-[100] transition-all">
    <div class="bg-white rounded-[2.5rem] p-8 w-full max-w-md relative max-h-[90vh] overflow-y-auto shadow-2xl">
        <button onclick="closeModal()" class="absolute top-6 left-6 text-gray-400 hover:text-black text-3xl">&times;</button>
        <div id="modalBody" class="mt-4"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, push, onValue, update, remove, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAUx02wlCwG41MBEob1Ql6vKwEaotaaY6g",
        authDomain: "matam-3dad8.firebaseapp.com",
        databaseURL: "https://matam-3dad8-default-rtdb.firebaseio.com",
        projectId: "matam-3dad8",
        storageBucket: "matam-3dad8.firebasestorage.app",
        messagingSenderId: "275561023621",
        appId: "1:275561023621:web:123ae0e8173b15895981ec"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // State
    let menu = [], cart = [], isAdmin = false;

    // Real-time Sync
    onValue(ref(db, 'menu'), (snap) => {
        const data = snap.val();
        menu = data ? Object.entries(data).map(([k, v]) => ({...v, fKey: k})) : [];
        renderApp();
    });

    window.renderApp = () => {
        const grid = document.getElementById('appGrid');
        const search = document.getElementById('searchBox').value.toLowerCase();
        const cat = document.getElementById('catFilter').value;
        grid.innerHTML = '';

        menu.forEach(item => {
            if (cat !== 'all' && item.category !== cat) return;
            if (search && !item.name.toLowerCase().includes(search)) return;

            let finalPrice = item.price;
            let hasDiscount = item.discount > 0 && (!item.expiry || Date.now() < item.expiry);
            if(hasDiscount) finalPrice = item.price - (item.price * item.discount / 100);

            grid.innerHTML += `
                <div class="bg-white rounded-[2rem] overflow-hidden shadow-sm border border-gray-50 group hover:shadow-xl transition-all relative">
                    ${hasDiscount ? `<span class="absolute top-3 right-3 badge-discount text-white text-[10px] px-3 py-1 rounded-full z-10 font-bold shadow-md">خصم ${item.discount}%</span>` : ''}
                    <img src="${item.imageUrl}" class="w-full h-40 object-cover group-hover:scale-105 transition-transform" onclick="viewItem('${item.fKey}')">
                    <div class="p-4">
                        <h3 class="font-bold text-gray-800 mb-1 truncate">${item.name}</h3>
                        <div class="flex items-center gap-2 mb-4">
                            <span class="text-orange-600 font-black text-sm">${finalPrice} IQD</span>
                            ${hasDiscount ? `<span class="text-gray-300 text-[10px] line-through">${item.price}</span>` : ''}
                        </div>
                        <button onclick="addToCart('${item.fKey}')" class="w-full bg-gray-50 hover:bg-orange-600 hover:text-white text-orange-600 py-3 rounded-2xl text-xs font-bold transition-colors">أضف للسلة</button>
                        ${isAdmin ? `<button onclick="adminTools('${item.fKey}')" class="w-full mt-2 bg-black text-white py-2 rounded-xl text-[10px]">إدارة</button>` : ''}
                    </div>
                </div>
            `;
        });
    };

    // Cart Logic
    window.addToCart = (key) => {
        cart.push(menu.find(i => i.fKey === key));
        updateCartUI();
    };

    function updateCartUI() {
        const bar = document.getElementById('cartBar');
        if(cart.length > 0) {
            bar.classList.remove('hidden');
            let total = cart.reduce((s, i) => {
                let p = i.price;
                if(i.discount > 0 && (!i.expiry || Date.now() < i.expiry)) p -= (p * i.discount / 100);
                return s + p;
            }, 0);
            document.getElementById('cartTotal').innerText = total + " IQD";
        } else {
            bar.classList.add('hidden');
        }
    }

    window.openCheckout = () => {
        let itemsHtml = cart.map((item, idx) => `
            <div class="flex justify-between items-center mb-3 bg-gray-50 p-3 rounded-xl">
                <span class="text-sm font-bold">${item.name}</span>
                <button onclick="removeFromCart(${idx})" class="text-red-500 font-bold">×</button>
            </div>
        `).join('');
        
        showModal(`
            <h2 class="text-2xl font-black mb-6">تأكيد طلبك</h2>
            <div class="mb-6 max-h-48 overflow-y-auto">${itemsHtml}</div>
            <label class="block text-xs font-bold text-gray-400 mb-2">اختر رقم الطاولة</label>
            <select id="tNum" class="w-full p-4 bg-gray-100 rounded-2xl mb-6 outline-none appearance-none font-bold">
                ${Array.from({length:30}, (_,i) => `<option value="${i+1}">طاولة رقم ${i+1}</option>`).join('')}
            </select>
            <button onclick="sendOrder()" class="w-full bg-orange-600 text-white p-5 rounded-3xl font-bold shadow-lg">إرسال للمطبخ</button>
        `);
    };

    window.removeFromCart = (idx) => { cart.splice(idx, 1); openCheckout(); updateCartUI(); };

    window.sendOrder = () => {
        const order = {
            table: document.getElementById('tNum').value,
            items: cart.map(i => i.name).join(' + '),
            status: '⏳ قيد الانتظار',
            time: new Date().toLocaleTimeString(),
            total: document.getElementById('cartTotal').innerText
        };
        push(ref(db, 'orders'), order).then(() => {
            alert("تم إرسال طلبك بنجاح!");
            cart = []; updateCartUI(); closeModal();
        });
    };

    // Admin Access
    window.adminLogin = async () => {
        const pass = prompt("كلمة مرور الإدارة:");
        if(!pass) return;
        const sRef = ref(db, 'settings/adminPass');
        const snap = await get(sRef);
        if(!snap.exists()) {
            await set(sRef, pass);
            alert("تم تعيين الباسوورد بنجاح!");
            location.reload();
        } else if(snap.val() === pass) {
            isAdmin = true;
            document.getElementById('adminBtn').innerText = "وضع الإدارة مفعل";
            renderApp();
            showAdminMenu();
        } else {
            alert("كلمة مرور خاطئة");
        }
    };

    function showAdminMenu() {
        const div = document.createElement('div');
        div.className = "fixed bottom-28 right-6 flex flex-col gap-3 z-50";
        div.innerHTML = `
            <button onclick="addForm()" class="bg-black text-white w-14 h-14 rounded-full shadow-2xl flex items-center justify-center text-2xl font-bold">＋</button>
            <button onclick="showOrders()" class="bg-blue-600 text-white w-14 h-14 rounded-full shadow-2xl flex items-center justify-center text-xl">📋</button>
        `;
        document.body.appendChild(div);
    }

    window.addForm = () => {
        showModal(`
            <h2 class="text-xl font-black mb-4">إضافة صنف جديد</h2>
            <div class="space-y-3">
                <input id="n" placeholder="اسم الوجبة" class="w-full p-4 bg-gray-50 rounded-2xl outline-none">
                <select id="c" class="w-full p-4 bg-gray-50 rounded-2xl outline-none">
                    <option>أكل</option><option>مشروب</option><option>حلويات</option>
                </select>
                <input id="p" type="number" placeholder="السعر" class="w-full p-4 bg-gray-50 rounded-2xl outline-none">
                <input id="u" placeholder="رابط الصورة المباشر" class="w-full p-4 bg-gray-50 rounded-2xl outline-none">
                <button onclick="saveItem()" class="w-full bg-black text-white p-4 rounded-2xl font-bold">نشر الصنف</button>
            </div>
        `);
    };

    window.saveItem = () => {
        const newItem = {
            id: Math.floor(Math.random() * 900) + 100,
            name: document.getElementById('n').value,
            category: document.getElementById('c').value,
            price: Number(document.getElementById('p').value),
            imageUrl: document.getElementById('u').value,
            discount: 0, ratingSum: 0, ratingCount: 0
        };
        push(ref(db, 'menu'), newItem).then(closeModal);
    };

    window.adminTools = (key) => {
        const item = menu.find(i => i.fKey === key);
        showModal(`
            <h2 class="font-bold mb-4 text-center">${item.name}</h2>
            <div class="grid grid-cols-1 gap-2">
                <button onclick="discountUI('${key}')" class="p-4 border rounded-2xl text-red-500 font-bold">تفعيل خصم %</button>
                <button onclick="update(ref(db, 'menu/${key}'), {discount:0})" class="p-4 border rounded-2xl">إزالة الخصم</button>
                <button onclick="if(confirm('حذف؟')) remove(ref(db, 'menu/${key}'))" class="p-4 bg-red-50 text-red-600 rounded-2xl">حذف نهائي</button>
            </div>
        `);
    };

    window.discountUI = (key) => {
        showModal(`
            <h2 class="font-bold mb-4">ضبط الخصم</h2>
            <input id="perc" type="number" placeholder="نسبة الخصم (مثلاً 20)" class="w-full p-4 bg-gray-50 rounded-2xl mb-2">
            <select id="dur" class="w-full p-4 bg-gray-50 rounded-2xl mb-4">
                <option value="1">ساعة واحدة</option>
                <option value="24">يوم كامل</option>
                <option value="8760">دائم</option>
            </select>
            <button id="dBtn" class="w-full bg-red-600 text-white p-4 rounded-2xl font-bold">تأكيد الخصم</button>
        `);
        document.getElementById('dBtn').onclick = () => {
            const expiry = Date.now() + (Number(document.getElementById('dur').value) * 3600000);
            update(ref(db, `menu/${key}`), { discount: Number(document.getElementById('perc').value), expiry }).then(closeModal);
        };
    };

    window.showOrders = () => {
        get(ref(db, 'orders')).then(snap => {
            const data = snap.val();
            let html = data ? Object.entries(data).reverse().map(([k, v]) => `
                <div class="p-4 border-b text-xs mb-2">
                    <div class="flex justify-between font-black mb-1"><span>طاولة ${v.table}</span> <span class="text-orange-600">${v.status}</span></div>
                    <div class="text-gray-500 mb-2">${v.items}</div>
                    <div class="flex gap-2 font-bold">
                        <button onclick="updateOrder('${k}', '✅ اكتمل')" class="text-green-600 border border-green-600 px-3 py-1 rounded-lg">اكتمل</button>
                        <button onclick="remove(ref(db, 'orders/${k}')).then(showOrders)" class="text-red-400 border border-red-400 px-3 py-1 rounded-lg">حذف</button>
                    </div>
                </div>
            `).join('') : 'لا توجد طلبات حالية';
            showModal(`<h2 class="font-black mb-4">قائمة الطلبات</h2><div class="max-h-96 overflow-y-auto">${html}</div>`);
        });
    };

    window.updateOrder = (k, s) => update(ref(db, `orders/${k}`), {status: s}).then(showOrders);

    window.viewItem = (key) => {
        const item = menu.find(i => i.fKey === key);
        showModal(`
            <img src="${item.imageUrl}" class="w-full h-56 object-cover rounded-[2rem] mb-6 shadow-xl">
            <h2 class="text-2xl font-black mb-2">${item.name}</h2>
            <div class="flex items-center gap-2 mb-6">
                <span class="text-orange-500 text-lg">⭐ ${(item.ratingSum/(item.ratingCount||1)).toFixed(1)}</span>
                <span class="text-gray-400 text-xs">(${item.ratingCount || 0} تقييم)</span>
            </div>
            <p class="text-gray-400 text-sm mb-6">ما هو تقييمك لهذه الوجبة؟</p>
            <div class="flex justify-center gap-3">
                ${[1,2,3,4,5].map(n => `<button onclick="rateItem('${key}', ${n})" class="text-4xl hover:scale-125 transition-transform">⭐</button>`).join('')}
            </div>
        `);
    };

    window.rateItem = (key, stars) => {
        const item = menu.find(i => i.fKey === key);
        update(ref(db, `menu/${key}`), {
            ratingSum: (item.ratingSum || 0) + stars,
            ratingCount: (item.ratingCount || 0) + 1
        }).then(() => { alert("شكراً لتقييمك!"); closeModal(); });
    };

    // UI Helpers
    window.showModal = (content) => { document.getElementById('modalBody').innerHTML = content; document.getElementById('modal').classList.remove('hidden'); };
    window.closeModal = () => document.getElementById('modal').classList.add('hidden');
</script>
</body>
</html>
